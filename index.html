<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کارهای خوب من 🌱</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>

  <div class="app">
    <header class="header">
      <h1>کارهای خوب من 🌱</h1>
      <p class="subtitle">هر کار خوب، یک قدم به نسخه بهتر خودت</p>
    </header>

    <div class="score-card">
      <div class="score-label">امتیاز امروز</div>
      <div class="score-value" id="score">0</div>
      <div class="level" id="level">سطح: تازه‌کار</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="progress-text" id="progressText">۰ / ۵۰ امتیاز تا سطح بعدی</div>
    </div>

    <div class="add-section">
      <input
        type="text"
        id="taskInput"
        placeholder="یه کار خوب که امروز انجام دادی..."
        maxlength="60"
      />
      <button id="addBtn">+</button>
    </div>

    <div class="tasks-list" id="tasksList"></div>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🌼</div>
      <p>هنوز کاری ثبت نشده</p>
      <span>اولین کار خوبت رو اضافه کن</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
